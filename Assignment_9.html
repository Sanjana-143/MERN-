```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f4f8;
            margin: 0;
            padding: 30px 15px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header {
            background-color: #243b55;
            color: white;
            text-align: center;
            padding: 28px 20px;
        }

        .header h1 {
            margin: 0 0 10px;
        }

        .header p {
            margin: 0;
            color: #e0e8f0;
        }

        form {
            padding: 28px;
        }

        fieldset {
            border: 1px solid #d5dce5;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        legend {
            font-size: 18px;
            font-weight: bold;
            color: #243b55;
            padding: 0 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd3dd;
            border-radius: 5px;
            font-size: 15px;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #315b8a;
            box-shadow: 0 0 4px rgba(49, 91, 138, 0.25);
        }

        .radio-options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .radio-options label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-weight: normal;
        }

        .radio-options input {
            width: auto;
        }

        .note {
            color: #666;
            font-size: 13px;
            margin-top: 6px;
        }

        .buttons {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn {
            background-color: #243b55;
            color: white;
        }

        .submit-btn:hover {
            background-color: #365b80;
        }

        .reset-btn {
            background-color: #e5e9ef;
            color: #333;
        }

        .reset-btn:hover {
            background-color: #d5dce5;
        }

        footer {
            text-align: center;
            color: #777;
            padding: 0 15px 20px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            form {
                padding: 18px;
            }

            fieldset {
                padding: 15px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>Job Application Form</h1>
            <p>Apply for an opportunity to join our team.</p>
        </header>

        <form action="#" method="post">

            <fieldset>
                <legend>Personal Information</legend>

                <div class="form-group">
                    <label for="fullname">Full Name *</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="address">Current Address</label>
                    <textarea
                        id="address"
                        name="address"
                        rows="3"
                        placeholder="Enter your current address"
                    ></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>Job Details</legend>

                <div class="form-group">
                    <label for="position">Position Applied For *</label>
                    <select id="position" name="position" required>
                        <option value="">-- Select Position --</option>
                        <option value="web-developer">Web Developer</option>
                        <option value="frontend-developer">Frontend Developer</option>
                        <option value="backend-developer">Backend Developer</option>
                        <option value="software-trainee">Software Trainee</option>
                        <option value="data-analyst">Data Analyst</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="employment">Employment Type *</label>
                    <select id="employment" name="employment" required>
                        <option value="">-- Select Employment Type --</option>
                        <option value="full-time">Full-Time</option>
                        <option value="part-time">Part-Time</option>
                        <option value="internship">Internship</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="experience">Work Experience</label>
                    <select id="experience" name="experience">
                        <option value="">-- Select Experience --</option>
                        <option value="fresher">Fresher</option>
                        <option value="less-than-2">Less than 2 years</option>
                        <option value="2-5">2–5 years</option>
                        <option value="above-5">Above 5 years</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="joining-date">Available Start Date</label>
                    <input
                        type="date"
                        id="joining-date"
                        name="joining-date"
                    >
                </div>
            </fieldset>

            <fieldset>
                <legend>Education and Skills</legend>

                <div class="form-group">
                    <label for="education">Highest Qualification *</label>
                    <select id="education" name="education" required>
                        <option value="">-- Select Qualification --</option>
                        <option value="12th">12th Standard</option>
                        <option value="diploma">Diploma</option>
                        <option value="bachelor">Bachelor's Degree</option>
                        <option value="master">Master's Degree</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="skills">Key Skills *</label>
                    <textarea
                        id="skills"
                        name="skills"
                        rows="3"
                        placeholder="e.g. HTML, CSS, JavaScript, React"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="resume">Upload Resume</label>
                    <input
                        type="file"
                        id="resume"
                        name="resume"
                        accept=".pdf,.doc,.docx"
                    >
                    <p class="note">Accepted formats: PDF, DOC, DOCX.</p>
                </div>
            </fieldset>

            <fieldset>
                <legend>Additional Information</legend>

                <div class="form-group">
                    <label for="cover-letter">Why should we hire you?</label>
                    <textarea
                        id="cover-letter"
                        name="cover-letter"
                        rows="4"
                        placeholder="Briefly describe your strengths and suitability for this role."
                    ></textarea>
                </div>

                <div class="form-group">
                    <label>Are you legally eligible to work in this location? *</label>

                    <div class="radio-options">
                        <label>
                            <input
                                type="radio"
                                name="work-eligibility"
                                value="yes"
                                required
                            >
                            Yes
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="work-eligibility"
                                value="no"
                            >
                            No
                        </label>
                    </div>
                </div>
            </fieldset>

            <div class="buttons">
                <button type="submit" class="submit-btn">
                    Submit Application
                </button>

                <button type="reset" class="reset-btn">
                    Reset Form
                </button>
            </div>

        </form>

        <footer>
            <p>Assignment 9 | MERN Stack Development</p>
        </footer>

    </main>

</body>
</html>
```
